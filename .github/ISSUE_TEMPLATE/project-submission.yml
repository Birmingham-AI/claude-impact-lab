name: Project Submission
description: Submit your team's project for the Birmingham Claude Impact Lab (deadline 2:00 PM CDT, August 28, 2026).
title: "[Submission] Team <ID> — <Team Name>"
labels:
  - submission
body:
  - type: markdown
    attributes:
      value: |
        Submit once, by the 2:00 PM CDT deadline. See SUBMISSIONS.md and RULES.md before filling this out.

  - type: dropdown
    id: team-id
    attributes:
      label: Team ID
      description: Your provisional team ID from TEAM_ASSIGNMENTS.md.
      options:
        - 1A
        - 1B
        - 1C
        - 2A
        - 2B
        - 2C
        - 3A
        - 3B
        - 3C
        - 4A
        - 4B
        - 4C
        - 5A
        - 5B
        - 5C
    validations:
      required: true

  - type: input
    id: team-name
    attributes:
      label: Team name
    validations:
      required: true

  - type: dropdown
    id: challenge
    attributes:
      label: Challenge
      options:
        - "1 — Choose Birmingham's Next Big Civic Project"
        - "2 — Make Regional Services Easier to Navigate"
        - "3 — Make Economic Opportunity Easier to Reach"
        - "4 — Improve the Handoff to Homelessness Services"
        - "5 — Coordinate Birmingham's Food Support Network"
    validations:
      required: true

  - type: input
    id: primary-user
    attributes:
      label: Primary user
      description: Who is this project for?
    validations:
      required: true

  - type: input
    id: repo-url
    attributes:
      label: Public project repository
      description: Link to your public GitHub repository.
      placeholder: https://github.com/your-org/your-repo
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What does the project do?
    validations:
      required: true

  - type: textarea
    id: data-sources
    attributes:
      label: Data and evidence sources
      description: List every public, licensed, or synthetic source used.
    validations:
      required: true

  - type: textarea
    id: claude-use
    attributes:
      label: How Claude was used
      description: How was Claude used to build the project, and how does Claude appear in the result, if applicable?
    validations:
      required: true

  - type: textarea
    id: works-today
    attributes:
      label: What works today
    validations:
      required: true

  - type: textarea
    id: limitations
    attributes:
      label: Known limitations
      description: Include known limitations and any simulated or synthetic elements.
    validations:
      required: true

  - type: textarea
    id: next-step
    attributes:
      label: Named next step
      description: The single next step toward a pilot.
    validations:
      required: true

  - type: input
    id: demo-url
    attributes:
      label: Demo video URL (optional)
      description: A 60-second demo video, required only if the artifact cannot be reviewed through a working public link.
    validations:
      required: false

  - type: input
    id: participant-names
    attributes:
      label: Participant names (optional)
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: This project is submitted in a public GitHub repository.
          required: true
        - label: All synthetic data used in this project is clearly labeled as synthetic and is not presented as real or live.
          required: true
        - label: No attendee data, private client records, confidential nonprofit data, health records, HMIS records, personally identifiable information, or other sensitive records were used.
          required: true
        - label: Consequential decisions in this project's workflow identify a point where a trained person must review or take over.
          required: true
